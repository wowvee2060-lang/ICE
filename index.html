<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#0b6fa4">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>เส้นทางส่งน้ำแข็ง</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:system-ui,"Noto Sans Thai",sans-serif;background:#f2f5f7;color:#16222b}
#app{display:flex;flex-direction:column;height:100%}
#body{flex:1;min-height:0;display:flex;flex-direction:column}
@media (orientation:landscape) and (max-height:560px){
  #body{flex-direction:row}
  #map{flex:1 1 50%;min-height:0;min-width:0}
  #panel{flex:1 1 50%;min-width:0}
  header{padding:4px 12px}
  header .sum{font-size:12px}
}
header{background:#0b6fa4;color:#fff;padding:8px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{font-size:17px;margin:0}
header .sum{font-size:13px;text-align:right;line-height:1.3}
#map{flex:0 0 34%;min-height:180px}
#panel{flex:1;overflow-y:auto;padding:10px;padding-bottom:40px}
.card{background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;box-shadow:0 1px 4px #0002}
.cur h2{margin:0 0 2px;font-size:20px}
.cur .sub{color:#5b6b76;font-size:14px;margin-bottom:8px}
.xbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.xbtns button{border:0;border-radius:12px;padding:14px 4px;font-size:16px;font-weight:700;color:#fff}
.btns{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:10px 0 6px}
.btns button{border:0;border-radius:12px;padding:18px 4px;font-size:18px;font-weight:700;color:#fff}
.b-paid{background:#1e9e4a}.b-owe{background:#e08a00}.b-closed{background:#c0392b}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 12px;font-size:15px;background:#e3ebf0;color:#16222b;text-decoration:none;display:inline-block}
.btn.pri{background:#0b6fa4;color:#fff}
.btn.ok{background:#1e9e4a;color:#fff}
.btn.sm{padding:6px 9px;font-size:13px}
input[type=text],input[type=number]{width:100%;padding:11px;border:1px solid #c3cfd6;border-radius:10px;font-size:16px}
.item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-bottom:1px solid #e6edf1}
.item:last-child{border-bottom:0}
.item.sel{background:#e8f4fb;border-radius:10px}
.num{flex:0 0 30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.s-pending{background:#0b6fa4}.s-paid{background:#1e9e4a}.s-owe{background:#e08a00}.s-closed{background:#c0392b}
.item .t{flex:1;min-width:0}
.item .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:13px;color:#5b6b76}
.pin{width:30px;height:30px;border-radius:50%;color:#fff;font-weight:700;display:flex;align-items:center;justify-content:center;border:3px solid #fff;box-shadow:0 1px 5px #0006;font-size:13px}
.pin.cur{transform:scale(1.3);outline:3px solid #ffd400}
.hint{color:#5b6b76;font-size:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button{flex:1;padding:12px 2px;font-size:14px}
.tabs .on{background:#0b6fa4;color:#fff}
.chip{display:inline-block;background:#e0f0fa;color:#0b4f78;border-radius:999px;padding:3px 10px;margin:2px 4px 2px 0;font-size:14px;font-weight:600}
.qgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.qgrid label,.lbl{font-size:13px;color:#5b6b76;display:block;margin-bottom:3px}
select{width:100%;padding:11px;border:1px solid #c3cfd6;border-radius:10px;font-size:16px;background:#fff}
.s-rest{background:#9aa7b0}
.hhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hrow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.warn{background:#fff3da;border:1px solid #f0c36a;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.big{font-size:22px;font-weight:800;color:#c26a00}
.dline{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed #e0e7ec;font-size:14px}
textarea{width:100%;height:120px;font-size:13px;border-radius:10px;border:1px solid #c3cfd6;padding:8px}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🧊 ส่งน้ำแข็ง</h1>
    <div class="sum" id="sum"></div>
  </header>
  <div id="body">
  <div id="map"></div>
  <div id="panel">
    <div class="tabs">
      <button class="btn on" id="tabRun">ออกส่ง</button>
      <button class="btn" id="tabEdit">จัดจุดส่ง</button>
      <button class="btn" id="tabDebt">ลูกหนี้</button>
      <button class="btn" id="tabHist">ประวัติ</button>
    </div>
    <div id="content"></div>
  </div>
  </div>
</div>

<script>
var KEY = "iceRoute.v2", OLD = "iceRoute.v1";
var stops = [], debts = [], walkins = [], history = {}, extras = [], extraOpen = null, openDay = null, startPt = null, settingStart = false, startMarker = null;
var selId = null, mode = "run", pending = null, pendingMarker = null;
var markers = {}, myMarker = null, msg = "", editingId = null;

function load(){
  try{
    var s = localStorage.getItem(KEY);
    if(s){ var o = JSON.parse(s); stops = o.stops||[]; debts = o.debts||[]; walkins = o.walkins||[]; history = o.history||{}; extras = o.extras||[]; startPt = o.startPt||null; return; }
    var s1 = localStorage.getItem(OLD);
    if(s1) stops = JSON.parse(s1);
  }catch(e){}
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify({stops:stops, debts:debts, walkins:walkins, history:history, extras:extras, startPt:startPt})); }catch(e){} }
load();

function dateOf(iso){ var d=new Date(iso); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function archiveStop(s){
  if(s.status==="pending" || !s.time) return;
  var d = dateOf(s.time);
  if(!history[d]) history[d] = {items:{}};
  history[d].items[s.id] = {name:s.name, status:s.status, amount:Number(s.amount||0), time:s.time};
}
// ขึ้นวันใหม่: เก็บผลของวันก่อนเข้าประวัติ แล้วรีเซ็ตสถานะร้านประจำ (ลูกหนี้ไม่รีเซ็ต)
function rolloverIfNeeded(){
  var t = today(), changed = false;
  stops.forEach(function(s){
    if(s.status!=="pending" && s.time && dateOf(s.time)<t){ archiveStop(s); s.status="pending"; s.time=null; changed=true; }
  });
  if(changed){ selId=null; save(); }
  return changed;
}
rolloverIfNeeded();

function today(){ var d=new Date(), m=d.getMonth()+1, dd=d.getDate(); return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(dd<10?"0":"")+dd; }
function fmtDate(s){ var p=s.split("-"); return Number(p[2])+"/"+Number(p[1])+"/"+(Number(p[0])+543-2500); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
function money(n){ return Number(n||0).toLocaleString("th-TH"); }

var map = L.map("map", {zoomControl:true}).setView([13.7563,100.5018], 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {maxZoom:19, attribution:"© OpenStreetMap"}).addTo(map);

var COLORS = {pending:"#0b6fa4", paid:"#1e9e4a", owe:"#e08a00", closed:"#c0392b"};
var ICE = [["big","หลอดใหญ่"],["small","หลอดเล็ก"],["fine","บดละเอียด"],["coarse","บดหยาบ"]];
function pad(n){ return n<10?"0"+n:""+n; }
function dayNum(d){ var p=d.split("-"); return Math.round(Date.UTC(+p[0],+p[1]-1,+p[2])/86400000); }
function addDays(d,n){ var x=new Date((dayNum(d)+n)*86400000); return x.getUTCFullYear()+"-"+pad(x.getUTCMonth()+1)+"-"+pad(x.getUTCDate()); }
function isDue(s){ if(s.freq!=="alt"||!s.altStart) return true; return (((dayNum(today())-dayNum(s.altStart))%2)+2)%2===0; }
function active(s){ return isDue(s) || s.status!=="pending"; }
function orderChips(s){ var h=""; ICE.forEach(function(t){ var q=(s.order||{})[t[0]]; if(q) h+='<span class="chip">'+t[1]+' '+q+'</span>'; }); return h; }
function orderText(s){ var a=[]; ICE.forEach(function(t){ var q=(s.order||{})[t[0]]; if(q) a.push(t[1]+" "+q); }); return a.join(", "); }
function loadTotals(){
  var tot={}; stops.forEach(function(s){ if(!isDue(s)) return; ICE.forEach(function(t){ var q=Number((s.order||{})[t[0]]||0); if(q) tot[t[0]]=(tot[t[0]]||0)+q; }); });
  var a=[]; ICE.forEach(function(t){ if(tot[t[0]]) a.push(t[1]+" "+tot[t[0]]); }); return a.join(" · ");
}
function formHTML(p, s){
  s = s||{}; var o = s.order||{}, h = '<input type="text" id="'+p+'Name" placeholder="ชื่อร้าน" autocomplete="off" value="'+esc(s.name||"")+'"><div style="height:8px"></div>'+
    '<div class="lbl">ความต้องการประจำ (จำนวน)</div><div class="qgrid">';
  ICE.forEach(function(t){ h += '<div><label>'+t[1]+'</label><input type="number" inputmode="numeric" id="'+p+'Q_'+t[0]+'" value="'+(o[t[0]]||"")+'" placeholder="0"></div>'; });
  h += '</div><div style="height:8px"></div>'+
    '<div class="lbl">หมายเหตุ (เช่น ฝากไว้หลังร้าน, ชอบแช่แข็งมาก)</div><input type="text" id="'+p+'Note" value="'+esc(s.note||"")+'"><div style="height:8px"></div>'+
    '<div class="qgrid"><div><label>รอบส่ง</label><select id="'+p+'Freq"><option value="daily"'+(s.freq==="alt"?"":" selected")+'>ทุกวัน</option><option value="alt"'+(s.freq==="alt"?" selected":"")+'>วันเว้นวัน</option></select></div>'+
    '<div><label>ถ้าเว้นวัน ส่งรอบนี้</label><select id="'+p+'Phase"><option value="today"'+(isDue(s)?" selected":"")+'>วันนี้</option><option value="tomorrow"'+(isDue(s)?"":" selected")+'>พรุ่งนี้</option></select></div></div><div style="height:8px"></div>'+
    '<label class="lbl">ยอดเงินปกติ (ไม่ใส่ก็ได้)</label><input type="number" inputmode="decimal" id="'+p+'Amt" value="'+(s.amount||"")+'" placeholder="0">';
  return h;
}
function readForm(p){
  var g = function(id){ return document.getElementById(p+id); }, order = {};
  ICE.forEach(function(t){ var q = Number(g("Q_"+t[0]).value||0); if(q>0) order[t[0]] = q; });
  var freq = g("Freq").value;
  return {name:g("Name").value.trim(), order:order, note:g("Note").value.trim(), freq:freq,
    altStart: freq==="alt" ? (g("Phase").value==="today" ? today() : addDays(today(),1)) : null,
    amount: Number(g("Amt").value||0)};
}
var LABEL  = {pending:"รอส่ง", paid:"จ่ายสด", owe:"ค้างจ่าย", closed:"ร้านปิด"};

function curStop(){
  var s = stops.filter(function(x){return x.id===selId;})[0];
  return s || nextPending();
}
function nextPending(){ return stops.filter(function(x){return x.status==="pending" && isDue(x);})[0] || null; }

/* ---------- ลูกหนี้ ---------- */
function oldDebts(stopId){
  var t = today();
  return debts.filter(function(d){ return d.stopId===stopId && !d.paid && d.date<t; });
}
function sumDebts(list){ return list.reduce(function(a,d){return a+Number(d.amount||0);},0); }
function unpaid(){ return debts.filter(function(d){return !d.paid;}); }
function syncDebt(s){
  var t = today();
  debts = debts.filter(function(d){ return !(d.stopId===s.id && d.date===t && !d.paid && d.auto); });
  if(s.status==="owe"){
    debts.push({id:uid(), stopId:s.id, name:s.name, amount:Number(s.amount||0), date:t, paid:false, auto:true});
  }
}
function payDebts(list){
  var t = today();
  list.forEach(function(d){ d.paid = true; d.paidDate = t; d.auto = false; });
  save(); render();
}

/* ---------- ซื้อเพิ่ม ---------- */
function addExtra(stopId, amt, kind){
  var st = stops.filter(function(x){return x.id===stopId;})[0];
  var e = {id:uid(), stopId:stopId, name:st?st.name:"", date:today(), time:new Date().toISOString(), amount:amt, kind:kind};
  if(kind==="owe"){
    var d = {id:uid(), stopId:stopId, name:e.name, amount:amt, date:e.date, paid:false, auto:false, extraId:e.id};
    debts.push(d); e.debtId = d.id;
  }
  extras.push(e); save();
}
function delExtra(id){
  var e = extras.filter(function(x){return x.id===id;})[0]; if(!e) return;
  if(e.debtId) debts = debts.filter(function(d){return d.id!==e.debtId;});
  extras = extras.filter(function(x){return x.id!==id;}); save();
}
function extraBlock(stopId){
  var t = today(), list = extras.filter(function(e){return e.stopId===stopId && e.date===t;});
  var h = '<div style="margin-top:10px;border-top:1px dashed #d5dee4;padding-top:8px">';
  list.forEach(function(e){
    h += '<div class="dline"><span>ซื้อเพิ่ม ฿'+money(e.amount)+' · '+(e.kind==="paid"?"จ่ายสด":"ค้างจ่าย")+'</span><button class="btn sm" data-xdel="'+e.id+'">ลบ</button></div>';
  });
  if(extraOpen===stopId){
    h += '<input type="number" inputmode="decimal" id="xAmt" placeholder="ยอดซื้อเพิ่ม ฿" style="margin-top:6px">'+
      '<div class="xbtns"><button style="background:#1e9e4a" data-xk="paid">จ่ายสด</button><button style="background:#e08a00" data-xk="owe">ค้างจ่าย</button></div>'+
      '<button class="btn sm" data-xopen="">ยกเลิก</button>';
  } else {
    h += '<button class="btn" data-xopen="'+stopId+'">➕ ซื้อเพิ่ม</button>';
  }
  return h+'</div>';
}
function bindExtra(el){
  el.querySelectorAll("[data-xopen]").forEach(function(b){
    b.onclick = function(){ extraOpen = b.getAttribute("data-xopen")||null; render(); var x=document.getElementById("xAmt"); if(x) x.focus(); };
  });
  el.querySelectorAll("[data-xk]").forEach(function(b){
    b.onclick = function(){
      var a = Number((document.getElementById("xAmt")||{}).value||0);
      if(!(a>0)){ var x=document.getElementById("xAmt"); if(x) x.focus(); return; }
      addExtra(extraOpen, a, b.getAttribute("data-xk")); extraOpen = null; render();
    };
  });
  el.querySelectorAll("[data-xdel]").forEach(function(b){
    b.onclick = function(){ delExtra(b.getAttribute("data-xdel")); render(); };
  });
}

/* ---------- ขาจร ---------- */
function walkToday(){ var t=today(); return walkins.filter(function(w){return w.date===t;}).reduce(function(a,w){return a+Number(w.amount||0);},0); }
function walkinHTML(){
  var t = today(), list = walkins.filter(function(w){return w.date===t;}), h = '<div class="card"><b>🚐 ขาจร (โบกรถซื้อ)</b>'+
    '<div class="row" style="margin-top:8px"><input type="number" inputmode="decimal" id="wAmt" placeholder="จำนวนเงิน ฿" style="flex:1;min-width:120px">'+
    '<input type="text" id="wNote" placeholder="หมายเหตุ (ไม่ใส่ก็ได้)" style="flex:1;min-width:120px"></div>'+
    '<div class="row" style="margin-top:8px"><button class="btn ok" id="wAdd">บันทึกขาจร</button></div>'+
    '<div style="margin-top:8px"><b>วันนี้ ฿'+money(walkToday())+'</b> <span class="hint">('+list.length+' ครั้ง)</span></div>';
  list.slice().reverse().forEach(function(w){
    var d = new Date(w.time||0), hm = pad(d.getHours())+":"+pad(d.getMinutes());
    h += '<div class="dline"><span>'+hm+' · ฿'+money(w.amount)+(w.note?' · '+esc(w.note):'')+'</span><button class="btn sm" data-wdel="'+w.id+'">ลบ</button></div>';
  });
  var days = {}, order = [];
  walkins.forEach(function(w){ if(w.date===t) return; if(!days[w.date]){days[w.date]={sum:0,n:0};order.push(w.date);} days[w.date].sum+=Number(w.amount||0); days[w.date].n++; });
  order.sort().reverse().slice(0,7);
  if(order.length){
    h += '<div class="hint" style="margin-top:8px">ย้อนหลัง</div>';
    order.slice(0,7).forEach(function(k){ h += '<div class="dline"><span>'+fmtDate(k)+' ('+days[k].n+' ครั้ง)</span><b>฿'+money(days[k].sum)+'</b></div>'; });
  }
  return h+'</div>';
}
function bindWalkin(el){
  var add = el.querySelector("#wAdd"); if(!add) return;
  add.onclick = function(){
    var a = Number(el.querySelector("#wAmt").value||0);
    if(!(a>0)){ el.querySelector("#wAmt").focus(); return; }
    walkins.push({id:uid(), date:today(), time:new Date().toISOString(), amount:a, note:el.querySelector("#wNote").value.trim()});
    save(); render();
  };
  el.querySelectorAll("[data-wdel]").forEach(function(b){
    b.onclick = function(){ var id=b.getAttribute("data-wdel"); walkins = walkins.filter(function(w){return w.id!==id;}); save(); render(); };
  });
}

/* ---------- แผนที่ ---------- */
function drawMarkers(){
  Object.keys(markers).forEach(function(k){ map.removeLayer(markers[k]); });
  markers = {};
  if(startMarker){ map.removeLayer(startMarker); startMarker=null; }
  if(startPt){
    startMarker = L.marker([startPt.lat,startPt.lng], {icon:L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,15],
      html:'<div class="pin" style="background:#2a6df4;border-radius:8px">🏠</div>'})}).addTo(map);
  }
  var cur = curStop();
  stops.forEach(function(s,i){
    var isCur = cur && cur.id===s.id && mode==="run";
    var icon = L.divIcon({className:"", iconSize:[30,30], iconAnchor:[15,15],
      html:'<div class="pin'+(isCur?' cur':'')+'" style="background:'+(s.status==="pending"&&!isDue(s)?"#9aa7b0":COLORS[s.status])+'">'+(i+1)+'</div>'});
    var m = L.marker([s.lat,s.lng], {icon:icon}).addTo(map);
    m.on("click", function(){ selId = s.id; if(mode!=="run") setMode("run"); else render(); });
    markers[s.id] = m;
  });
}
function fitAll(){
  if(!stops.length) return;
  map.fitBounds(L.latLngBounds(stops.map(function(s){return [s.lat,s.lng];})), {padding:[40,40], maxZoom:16});
}

function summary(){
  var t = today(), paid=0, owe=0, closed=0, cash=0, newDebt=0, collected=0;
  stops.forEach(function(s){
    if(s.status==="paid"){paid++; cash+=Number(s.amount||0);}
    if(s.status==="owe"){owe++; newDebt+=Number(s.amount||0);}
    if(s.status==="closed") closed++;
  });
  debts.forEach(function(d){ if(d.paid && d.paidDate===t) collected+=Number(d.amount||0); });
  var exP=0, exO=0;
  extras.forEach(function(e){ if(e.date===t){ if(e.kind==="paid") exP+=Number(e.amount||0); else exO+=Number(e.amount||0); } });
  cash += exP; newDebt += exO;
  var done = paid+owe+closed, total = stops.filter(active).length, walk = walkToday();
  document.getElementById("sum").innerHTML =
    "ส่งแล้ว "+done+"/"+total+" · สด ฿"+money(cash+collected)+"<br>ขาจร ฿"+money(walk)+"<br>ค้างใหม่ ฿"+money(newDebt)+" · ค้างรวม ฿"+money(sumDebts(unpaid()));
  return {extra:exP+exO,walk:walk,total:total,paid:paid,owe:owe,closed:closed,cash:cash,newDebt:newDebt,collected:collected,done:done};
}

function setStatus(id, st){
  var s = stops.filter(function(x){return x.id===id;})[0];
  if(!s) return;
  s.status = st; s.time = st==="pending" ? null : new Date().toISOString();
  syncDebt(s);
  save();
  if(st!=="pending"){ var n = nextPending(); selId = n ? n.id : id; }
  render();
  if(st!=="pending"){ var c = curStop(); if(c) map.panTo([c.lat,c.lng]); }
}
function navLink(s){ return "https://www.google.com/maps/dir/?api=1&destination="+s.lat+","+s.lng+"&travelmode=driving"; }

/* ---------- แท็บออกส่ง ---------- */
function renderRun(){
  var el = document.getElementById("content");
  if(!stops.length){
    el.innerHTML = '<div class="card hint">ยังไม่มีจุดส่ง กดแท็บ "จัดจุดส่ง" แล้วแตะบนแผนที่เพื่อปักหมุด</div>'+walkinHTML();
    bindWalkin(el);
    return;
  }
  var c = curStop(), h = "", sm = summary();

var routeLayer = null, routeInfo = null;
function clearRoute(){ if(routeLayer){ map.removeLayer(routeLayer); routeLayer=null; } routeInfo=null; }
async function showRouteTo(stopId){
  var st = stops.filter(function(x){return x.id===stopId;})[0]; if(!st) return;
  clearRoute();
  var from = myPos ? {lat:myPos.lat,lng:myPos.lng} : startPt, label = myPos ? "ตำแหน่งปัจจุบัน" : "จุดเริ่มต้นที่ตั้งไว้";
  if(!from){ routeInfo = {id:stopId, text:"ยังไม่มีตำแหน่งปัจจุบัน (อนุญาตตำแหน่งให้ Chrome หรือตั้ง 🏠 จุดเริ่มต้น) แสดงเฉพาะที่ตั้งร้าน"}; map.setView([st.lat,st.lng],16); render(); return; }
  routeInfo = {id:stopId, text:"กำลังหาเส้นทางจาก"+label+"..."}; render();
  var line = null, text = "";
  try{
    var ctl = new AbortController(), to = setTimeout(function(){ctl.abort();}, 9000);
    var r = await fetch("https://router.project-osrm.org/route/v1/driving/"+from.lng+","+from.lat+";"+st.lng+","+st.lat+"?overview=full&geometries=geojson", {signal:ctl.signal});
    clearTimeout(to);
    var j = await r.json();
    if(j.code==="Ok" && j.routes && j.routes[0]){
      var rt = j.routes[0];
      line = L.polyline(rt.geometry.coordinates.map(function(c){return [c[1],c[0]];}), {color:"#2a6df4", weight:6, opacity:0.85});
      text = "จาก"+label+" ระยะทาง "+(rt.distance/1000).toFixed(1)+" กม. ประมาณ "+Math.max(1,Math.round(rt.duration/60))+" นาที";
    }
  }catch(e){}
  if(!line){
    line = L.polyline([[from.lat,from.lng],[st.lat,st.lng]], {color:"#2a6df4", weight:4, dashArray:"8 8"});
    text = "จาก"+label+" ตรงถึงร้านประมาณ "+hav(from,st).toFixed(1)+" กม. (เส้นตรง ต่อเน็ตหาเส้นถนนไม่ได้)";
  }
  routeLayer = line.addTo(map);
  routeInfo = {id:stopId, text:text};
  map.fitBounds(line.getBounds(), {padding:[40,40], maxZoom:17});
  render();
}
function renderDebt(){
  var el = document.getElementById("content"), list = unpaid(), h = "";
  h += '<div class="card"><div class="hint">ยอดลูกหนี้ค้างรวมทุกร้าน</div><div class="big">฿'+money(sumDebts(list))+'</div>'+(routeLayer?'<button class="btn sm" id="clrRoute" style="margin-top:6px">ล้างเส้นทางบนแผนที่</button>':'')+'</div>';
  if(!list.length){ h += '<div class="card hint">ไม่มียอดค้างจ่าย 🎉</div>'; el.innerHTML = h; return; }
  var groups = {}, order = [];
  list.forEach(function(d){ if(!groups[d.stopId]){ groups[d.stopId]=[]; order.push(d.stopId);} groups[d.stopId].push(d); });
  order.sort(function(a,b){ return sumDebts(groups[b])-sumDebts(groups[a]); });
  order.forEach(function(k){

    });

    h += '<div style="margin-top:8px" class="row"><button class="btn ok" data-payall="'+k+'">รับชำระทั้งร้าน</button>'+

  });
  el.querySelectorAll("[data-payall]").forEach(function(b){

  });

    b.onclick = function(){ showRouteTo(b.getAttribute("data-route")); };
  });
  bindExtra(el);
  var cr = document.getElementById("clrRoute"); if(cr) cr.onclick = function(){ clearRoute(); render(); };
}

/* ---------- ประวัติรายวัน ---------- */
function dayItems(d){
  var m = {}, k;
  if(history[d]) for(k in history[d].items) m[k] = history[d].items[k];
  if(d===today()) stops.forEach(function(x){ if(x.status!=="pending") m[x.id]={name:x.name,status:x.status,amount:Number(x.amount||0),time:x.time}; });
  return Object.keys(m).map(function(k2){return m[k2];}).sort(function(a,b){return (a.time||"")<(b.time||"")?-1:1;});
}
function dayStats(d){
  var r = {paid:0,paidN:0,owe:0,oweN:0,closedN:0,walk:0,walkN:0,coll:0,items:dayItems(d),walks:[],colls:[]};
  r.items.forEach(function(i){
    if(i.status==="paid"){ r.paid+=i.amount; r.paidN++; }
    else if(i.status==="owe"){ r.owe+=i.amount; r.oweN++; }
    else if(i.status==="closed"){ r.closedN++; }
  });
  walkins.forEach(function(w){ if(w.date===d){ r.walk+=Number(w.amount||0); r.walkN++; r.walks.push(w); } });
  debts.forEach(function(x){ if(x.paid && x.paidDate===d){ r.coll+=Number(x.amount||0); r.colls.push(x); } });
  r.extras = []; r.exPaid = 0; r.exOwe = 0;
  extras.forEach(function(e){ if(e.date===d){ r.extras.push(e); if(e.kind==="paid") r.exPaid+=Number(e.amount||0); else r.exOwe+=Number(e.amount||0); } });
  r.sales = r.paid + r.owe + r.walk + r.exPaid + r.exOwe;
  r.cashIn = r.paid + r.walk + r.coll + r.exPaid;
  return r;
}
function allDays(){
  var set = {}; set[today()] = 1;
  Object.keys(history).forEach(function(k){set[k]=1;});
  walkins.forEach(function(w){set[w.date]=1;});
  debts.forEach(function(x){ if(x.paidDate) set[x.paidDate]=1; });
  stops.forEach(function(x){ if(x.status!=="pending" && x.time) set[dateOf(x.time)]=1; });
  extras.forEach(function(e){ set[e.date]=1; });
  return Object.keys(set).sort().reverse();
}

function deleteDay(d){
  delete history[d];
  walkins = walkins.filter(function(w){return w.date!==d;});
  debts = debts.filter(function(x){return !(x.paid && x.paidDate===d);});
  var gone = extras.filter(function(e){return e.date===d;}).map(function(e){return e.debtId;});
  extras = extras.filter(function(e){return e.date!==d;});
  if(d===today()) debts = debts.filter(function(x){ return !(gone.indexOf(x.id)>=0 && !x.paid); });
  if(d===today()){
    stops.forEach(function(x){
      if(x.status!=="pending"){
        debts = debts.filter(function(y){return !(y.stopId===x.id && y.date===d && !y.paid && y.auto);});
        x.status="pending"; x.time=null;
      }
    });
    selId = null;
  }
  if(openDay===d) openDay=null;
}

/* ---------- จัดเส้นทางอัตโนมัติ ---------- */
function hav(a,b){
  var R=6371, r=Math.PI/180, dLa=(b.lat-a.lat)*r, dLo=(b.lng-a.lng)*r;
  var x=Math.sin(dLa/2)*Math.sin(dLa/2)+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLo/2)*Math.sin(dLo/2);
  return 2*R*Math.asin(Math.sqrt(x));
}
function localOrder(start, pts){
  // nearest neighbour แล้วปรับด้วย 2-opt (เส้นทางเปิด)
  var rest = pts.slice(), route = [], cur = start;
  if(!cur){ cur = rest.shift(); route.push(cur); }
  while(rest.length){
    var bi=0, bd=1e12;
    rest.forEach(function(p,i){ var d=hav(cur,p); if(d<bd){bd=d;bi=i;} });
    cur = rest.splice(bi,1)[0]; route.push(cur);
  }
  var full = (start?[start]:[]).concat(route), n = full.length, improved = true, guard = 0;
  while(improved && guard++<50){
    improved = false;
    for(var i=1;i<n-1;i++){
      for(var j=i+1;j<n;j++){
        var a=full[i-1], b=full[i], c=full[j], d=j+1<n?full[j+1]:null;
        var before = hav(a,b)+(d?hav(c,d):0), after = hav(a,c)+(d?hav(b,d):0);
        if(after < before-1e-9){
          var seg = full.slice(i,j+1).reverse();
          full = full.slice(0,i).concat(seg, full.slice(j+1));
          improved = true;
        }
      }
    }
  }
  return start ? full.slice(1) : full;
}
function getStart(){
  return new Promise(function(res){
    if(myPos) return res({lat:myPos.lat, lng:myPos.lng});
    if(!navigator.geolocation) return res(startPt);
    navigator.geolocation.getCurrentPosition(function(p){ res({lat:p.coords.latitude, lng:p.coords.longitude}); },
      function(){ res(startPt); }, {enableHighAccuracy:true, timeout:7000});
  });
}
async function osrmOrder(start, pts){
  var all = (start?[start]:[]).concat(pts);
  var coords = all.map(function(p){return p.lng+","+p.lat;}).join(";");
  var ctl = new AbortController(), to = setTimeout(function(){ctl.abort();}, 9000);
  try{
    var r = await fetch("https://router.project-osrm.org/trip/v1/driving/"+coords+"?source=first&roundtrip=false&overview=false", {signal:ctl.signal});
    var j = await r.json();
    if(j.code!=="Ok" || !j.waypoints || j.waypoints.length!==all.length) return null;
    var off = start?1:0, idx = [];
    for(var i=off;i<all.length;i++) idx.push({p:all[i], w:j.waypoints[i].waypoint_index});
    idx.sort(function(a,b){return a.w-b.w;});
    return idx.map(function(x){return x.p;});
  }catch(e){ return null; } finally { clearTimeout(to); }
}
async function autoRoute(){
  var pend = stops.filter(function(s){return s.status==="pending" && isDue(s);});
  var done = stops.filter(function(s){return !(s.status==="pending" && isDue(s));});
  if(pend.length<2){ msg = "ต้องมีร้านที่ต้องส่งวันนี้อย่างน้อย 2 ร้านครับ"; render(); return; }
  msg = "กำลังจัดเส้นทาง..."; render();
  var start = await getStart();
  var ordered = await osrmOrder(start, pend), how = "ตามระยะทางถนนจริง";
  if(!ordered){ ordered = localOrder(start, pend); how = "ตามระยะทางเส้นตรง (ต่อเน็ตเส้นทางถนนไม่ได้)"; }
  stops = done.concat(ordered);
  selId = null; save();
  msg = "จัดเสร็จแล้ว "+how+(start?(startPt&&start.lat===startPt.lat?" เริ่มจากจุดเริ่มต้นที่ตั้งไว้":" เริ่มจากตำแหน่งของคุณ"):" เริ่มจากร้านแรกที่รอส่ง");
  render(); fitAll();
}

var myPos = null, watchId = null, follow = false, geoErr = "", followCtl = null;
var GEO_FAIL = "เปิดตำแหน่งปัจจุบันไม่ได้ ตรวจว่าเปิดไฟล์ผ่านลิงก์ https และอนุญาตตำแหน่งให้ Chrome แล้ว (ตั้งค่า > ตำแหน่ง) หรือใช้ 🏠 ตั้งจุดเริ่มต้นแทนได้";
function updateMyMarker(){
  if(!myPos) return;
  var ll = [myPos.lat, myPos.lng];
  if(myMarker){ myMarker.setLatLng(ll); }
  else { myMarker = L.circleMarker(ll, {radius:9, color:"#fff", weight:3, fillColor:"#2a6df4", fillOpacity:1, interactive:false}).addTo(map); }
}
function startWatch(){
  if(watchId!==null || !navigator.geolocation) return;
  try{
    watchId = navigator.geolocation.watchPosition(function(p){
      myPos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
      geoErr = ""; updateMyMarker();
      if(follow) map.panTo([myPos.lat, myPos.lng], {animate:true});
    }, function(err){
      geoErr = err && err.code===1 ? "denied" : "error";
      if(err && err.code===1){ try{ navigator.geolocation.clearWatch(watchId); }catch(e){} watchId = null; }
    }, {enableHighAccuracy:true, maximumAge:3000, timeout:20000});
  }catch(e){ watchId = null; }
}
function locate(){
  startWatch();
  if(myPos){ map.setView([myPos.lat,myPos.lng], 17); msg=""; render(); return; }
  // ยังไม่มีตำแหน่ง: ขอครั้งเดียวให้เบราว์เซอร์ถามสิทธิ์
  if(!navigator.geolocation){ msg = GEO_FAIL; render(); return; }
  navigator.geolocation.getCurrentPosition(function(p){
    myPos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy};
    updateMyMarker(); map.setView([myPos.lat,myPos.lng], 17); msg=""; render();
  }, function(){ msg = GEO_FAIL; render(); }, {enableHighAccuracy:true, timeout:12000});
}
function pinHere(){
  startWatch();
  var go = function(){
    pending = {lat:myPos.lat, lng:myPos.lng, acc:myPos.acc}; editingId=null; settingStart=false;
    if(pendingMarker) map.removeLayer(pendingMarker);
    pendingMarker = L.marker([myPos.lat,myPos.lng]).addTo(map);
    map.setView([myPos.lat,myPos.lng], 18); msg=""; render();
    var n = document.getElementById("nName"); if(n) n.focus();
  };
  if(myPos){ go(); return; }
  if(!navigator.geolocation){ msg = GEO_FAIL; render(); return; }
  msg = "กำลังหาตำแหน่ง..."; render();
  navigator.geolocation.getCurrentPosition(function(p){
    myPos = {lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy}; updateMyMarker(); go();
  }, function(){ msg = GEO_FAIL; render(); }, {enableHighAccuracy:true, timeout:12000});
}

  follow = v;
